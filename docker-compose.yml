version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - nexusforge-network
    volumes:
      - ./frontend/src:/app/src

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusforge
      - REDIS_URL=redis://redis:6379/0
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-2}
    depends_on:
      - postgres
      - redis
    networks:
      - nexusforge-network
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexusforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexusforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexusforge-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexusforge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
