version: "3.8"

services:

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["alembic", "-c", "/app/app/alembic.ini", "upgrade", "head"]
    networks:
      - nexusforge-network
    volumes:
      - ./backend/app:/app/app
    restart: "no"
    user: "1000:1000"
    working_dir: /app

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusforge
      - REDIS_URL=redis://redis:6379/0
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-2}
      - JWT_SECRET_KEY=test-secret-key-32-chars-long-enough-for-hs256
      - SECRET_KEY=test-secret-key-32-chars-long-enough
      - ENCRYPTION_KEY=test-encryption-key-32-bytes-base64-c3RhY2xl
    depends_on:
      - postgres
      - redis
      - migrations
    networks:
      - nexusforge-network
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "worker.py", "--worker-id", "nexusforge-worker-01", "--hostname", "worker-01"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexusforge
      - REDIS_URL=redis://redis:6379/0
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-2}
      - JWT_SECRET_KEY=test-secret-key-32-chars-long-enough-for-hs256
      - SECRET_KEY=test-secret-key-32-chars-long-enough
      - ENCRYPTION_KEY=test-encryption-key-32-bytes-base64-c3RhY2tl
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - nexusforge-network
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexusforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexusforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexusforge-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nexusforge-network
    restart: unless-stopped

networks:
  nexusforge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: